<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Funding arbitrage diagram">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style>
<rect width="860" height="300" rx="14" fill="#0B1018" stroke="#1A2230"/>
<text x="24" y="36" fill="#E8EEF5" font-size="17" font-weight="700">Funding arb: hold spot, short the perp, collect funding</text>

<rect x="40" y="80" width="220" height="74" rx="10" fill="#3DDC97" fill-opacity=".12" stroke="#3DDC97" stroke-opacity=".75"/>
<text x="150" y="111" text-anchor="middle" fill="#3DDC97" font-size="16" font-weight="700">Buy spot</text>
<text x="150" y="133" text-anchor="middle" fill="#8A96A8" font-size="12">own the token</text>
<text x="290" y="124" text-anchor="middle" fill="#E8EEF5" font-size="26" font-weight="700">+</text>
<rect x="320" y="80" width="220" height="74" rx="10" fill="#FF6B7A" fill-opacity=".12" stroke="#FF6B7A" stroke-opacity=".75"/>
<text x="430" y="111" text-anchor="middle" fill="#FF6B7A" font-size="16" font-weight="700">Short the perp</text>
<text x="430" y="133" text-anchor="middle" fill="#8A96A8" font-size="12">same size</text>
<text x="570" y="124" text-anchor="middle" fill="#E8EEF5" font-size="26" font-weight="700">=</text>
<rect x="600" y="80" width="220" height="74" rx="10" fill="#97FCE4" fill-opacity=".12" stroke="#97FCE4" stroke-opacity=".75"/>
<text x="710" y="111" text-anchor="middle" fill="#97FCE4" font-size="16" font-weight="700">Price-neutral</text>
<text x="710" y="133" text-anchor="middle" fill="#8A96A8" font-size="12">gains on one leg offset the other</text>
<text x="40" y="206" fill="#E8EEF5" font-size="14">When funding is positive, shorts are paid by longs every hour on Hyperliquid.</text>
<text x="40" y="230" fill="#E8EEF5" font-size="14">Enter above --min-apr, exit both legs below --exit-apr.</text>
<text x="40" y="270" fill="#8A96A8" font-size="12">Funding flips sign without warning, and fees on four fills can exceed what a short window pays.</text>
</svg>