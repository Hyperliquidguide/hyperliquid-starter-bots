<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="Market maker quote diagram">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style>
<rect width="860" height="300" rx="14" fill="#0B1018" stroke="#1A2230"/>
<text x="24" y="36" fill="#E8EEF5" font-size="17" font-weight="700">Market maker: quote both sides, lean against inventory</text>

<text x="24" y="78" fill="#8A96A8" font-size="14">Flat: quotes sit evenly around the mid</text>
<line x1="24" y1="165" x2="404" y2="165" stroke="#8A96A8" stroke-dasharray="5 5"/>
<text x="408" y="169" fill="#8A96A8" font-size="12">mid</text>
<rect x="144" y="110" width="140" height="26" rx="6" fill="#FF6B7A" fill-opacity=".18" stroke="#FF6B7A"/>
<text x="214" y="128" text-anchor="middle" fill="#FF6B7A" font-size="13" font-weight="600">ASK (post-only)</text>
<rect x="144" y="194" width="140" height="26" rx="6" fill="#3DDC97" fill-opacity=".18" stroke="#3DDC97"/>
<text x="214" y="212" text-anchor="middle" fill="#3DDC97" font-size="13" font-weight="600">BID (post-only)</text>
<text x="24" y="272" fill="#E8EEF5" font-size="13">Position 0: spread split evenly</text><line x1="430" y1="64" x2="430" y2="280" stroke="#1A2230"/>
<text x="452" y="78" fill="#8A96A8" font-size="14">Long: both quotes shift down</text>
<line x1="452" y1="165" x2="832" y2="165" stroke="#8A96A8" stroke-dasharray="5 5"/>
<text x="836" y="169" fill="#8A96A8" font-size="12">mid</text>
<rect x="572" y="136" width="140" height="26" rx="6" fill="#FF6B7A" fill-opacity=".18" stroke="#FF6B7A"/>
<text x="642" y="154" text-anchor="middle" fill="#FF6B7A" font-size="13" font-weight="600">ASK (post-only)</text>
<rect x="572" y="220" width="140" height="26" rx="6" fill="#3DDC97" fill-opacity=".18" stroke="#3DDC97"/>
<text x="642" y="238" text-anchor="middle" fill="#3DDC97" font-size="13" font-weight="600">BID (post-only)</text>
<text x="452" y="272" fill="#E8EEF5" font-size="13">Long: ask moves closer, bid moves away</text>
</svg>