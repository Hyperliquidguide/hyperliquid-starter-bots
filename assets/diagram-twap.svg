<svg xmlns="http://www.w3.org/2000/svg" width="860" height="300" viewBox="0 0 860 300" role="img" aria-label="TWAP execution diagram">
<style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif}</style>
<rect width="860" height="300" rx="14" fill="#0B1018" stroke="#1A2230"/>
<text x="24" y="36" fill="#E8EEF5" font-size="17" font-weight="700">TWAP: equal slices over time, maker first, capped catch-up</text>
<rect x="40" y="92" width="84" height="70" rx="6" fill="#3DDC97" fill-opacity=".14" stroke="#3DDC97" stroke-opacity=".7"/><rect x="40" y="92" width="84" height="70" rx="6" fill="#3DDC97" fill-opacity=".35"/><text x="82" y="182" text-anchor="middle" fill="#8A96A8" font-size="11">slice 1</text><rect x="170" y="92" width="84" height="70" rx="6" fill="#3DDC97" fill-opacity=".14" stroke="#3DDC97" stroke-opacity=".7"/><rect x="170" y="123.5" width="84" height="38.5" rx="6" fill="#3DDC97" fill-opacity=".35"/><rect x="256" y="92" width="34" height="31.499999999999996" rx="5" fill="#F5C76B" fill-opacity=".3" stroke="#F5C76B" stroke-opacity=".8"/><text x="212" y="182" text-anchor="middle" fill="#8A96A8" font-size="11">slice 2</text><rect x="300" y="92" width="84" height="70" rx="6" fill="#3DDC97" fill-opacity=".14" stroke="#3DDC97" stroke-opacity=".7"/><rect x="300" y="92" width="84" height="70" rx="6" fill="#3DDC97" fill-opacity=".35"/><text x="342" y="182" text-anchor="middle" fill="#8A96A8" font-size="11">slice 3</text><rect x="430" y="92" width="84" height="70" rx="6" fill="#3DDC97" fill-opacity=".14" stroke="#3DDC97" stroke-opacity=".7"/><rect x="430" y="106" width="84" height="56" rx="6" fill="#3DDC97" fill-opacity=".35"/><rect x="516" y="92" width="34" height="13.999999999999996" rx="5" fill="#F5C76B" fill-opacity=".3" stroke="#F5C76B" stroke-opacity=".8"/><text x="472" y="182" text-anchor="middle" fill="#8A96A8" font-size="11">slice 4</text><rect x="560" y="92" width="84" height="70" rx="6" fill="#3DDC97" fill-opacity=".14" stroke="#3DDC97" stroke-opacity=".7"/><rect x="560" y="137.5" width="84" height="24.5" rx="6" fill="#3DDC97" fill-opacity=".35"/><rect x="646" y="92" width="34" height="45.5" rx="5" fill="#F5C76B" fill-opacity=".3" stroke="#F5C76B" stroke-opacity=".8"/><text x="602" y="182" text-anchor="middle" fill="#8A96A8" font-size="11">slice 5</text><rect x="690" y="92" width="84" height="70" rx="6" fill="#3DDC97" fill-opacity=".14" stroke="#3DDC97" stroke-opacity=".7"/><rect x="690" y="92" width="84" height="70" rx="6" fill="#3DDC97" fill-opacity=".35"/><text x="732" y="182" text-anchor="middle" fill="#8A96A8" font-size="11">slice 6</text><line x1="40" y1="78" x2="820" y2="78" stroke="#8A96A8" stroke-opacity=".6"/><text x="820" y="72" text-anchor="end" fill="#8A96A8" font-size="11">time →</text><rect x="40" y="214" width="14" height="14" rx="3" fill="#3DDC97" fill-opacity=".5"/><text x="62" y="226" fill="#E8EEF5" font-size="13">Rests post-only at the touch first: fills pay the maker fee.</text><rect x="40" y="240" width="14" height="14" rx="3" fill="#F5C76B" fill-opacity=".6"/><text x="62" y="252" fill="#E8EEF5" font-size="13">Whatever is left crosses with an IOC, capped by --max-slippage-bps and --limit-px.</text><text x="40" y="280" fill="#8A96A8" font-size="12">Execution tooling, not a strategy: it only decides how an order you chose gets filled.</text>
</svg>